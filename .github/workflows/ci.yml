name: Verify simulation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m line_calibration demo
