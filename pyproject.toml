[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "line-calibration"
version = "1.0.0"
description = "Event-driven calibration experiments for a manufacturing line simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "simpy>=4.1,<5",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
